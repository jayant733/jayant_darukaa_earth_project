[project]
name = "darukaa-api"
version = "0.1.0"
description = "Geospatial carbon and biodiversity analytics API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5",
  "bcrypt>=4.3.0",
  "email-validator>=2.3.0",
  "fastapi>=0.116.1",
  "geoalchemy2>=0.18.0",
  "psycopg[binary]>=3.2.9",
  "pyjwt>=2.10.1",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20",
  "shapely>=2.1.1",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "ruff>=0.12.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

